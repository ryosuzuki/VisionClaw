name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-openclaw-backend
    paths:
      - "samples/CameraAccessAndroid/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/CameraAccessAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and assemble
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: visionclaw-android-debug
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
